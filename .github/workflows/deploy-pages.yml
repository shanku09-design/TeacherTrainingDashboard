name: Deploy teacher training demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - codebase/**
      - docs/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets dist/docs/product-demo
          cp codebase/index.html codebase/dashboard.html codebase/demo-english.html codebase/demo-hindi.html dist/
          cp -R codebase/assets/css codebase/assets/js dist/assets/
          cp docs/*.html dist/docs/
          cp docs/product-demo/index.html docs/product-demo/*.mp4 docs/product-demo/*.srt docs/product-demo/*.vtt dist/docs/product-demo/
          test -s dist/index.html
          test -s dist/dashboard.html
          test -s dist/demo-english.html
          test -s dist/demo-hindi.html
          test -s dist/assets/js/auth.js
          test -s dist/assets/js/app.js
          test -s dist/docs/index.html
          test -s dist/docs/Teacher-Training-Tracker-PRD.html
          test -s dist/docs/Teacher-Training-Tracker-Test-Cases.html
          test -s dist/docs/Teacher-Training-Tracker-Code-Review.html
          test -s dist/docs/product-demo/index.html
          test -s dist/docs/product-demo/teacher-training-tracker-modules-english.mp4
          test -s dist/docs/product-demo/teacher-training-tracker-modules-hindi.mp4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
