<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher Training Tracker · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="brand-mark">TT</div><div><b>Training Tracker</b><small>KGBV Digital Classrooms</small></div></div>
    <div class="role-box">
      <label for="roleSel">Viewing as</label>
      <select id="roleSel" onchange="switchRole(this.value)">
                <option value="admin">Admin</option>
        <option value="trainer">Trainer</option>
        <option value="teacher">Trainee</option>
      </select>
      <div class="who" id="who"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Interactive demo with sample training data. Changes are saved in this browser.<br><button onclick="toggleTheme()">Switch light/dark</button> <button class="logout-demo" onclick="logoutDemo()">Sign out</button></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="menu-btn" onclick="document.getElementById('side').classList.toggle('open')" aria-label="Open menu">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <div class="ctl" id="stateCtl"><label class="small muted" for="stateSel">State</label><select id="stateSel" onchange="setState(this.value)"></select></div>
      <div class="ctl"><label class="small muted" for="asOfSel">Data as of</label><select id="asOfSel" onchange="setAsOf(this.value)"></select></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<dialog id="dlg"><div class="dlg-h"><h2 id="dlgT"></h2><button class="x" onclick="dlg.close()">Close</button></div><div class="dlg-b" id="dlgB"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="assets/js/auth.js"></script><script src="assets/js/app.js"></script>
</body>
</html>
